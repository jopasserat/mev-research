<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashbots Research — Publications</title>
<meta name="description" content="Papers, writings, and research posts from the Flashbots research team.">
<!-- flashbots.net's own favicons -->
<link rel="shortcut icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<!-- link previews; crawlers don't run JS, so a ?q= link shows this same card -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Flashbots Research">
<meta property="og:title" content="Flashbots Research — Publications">
<meta property="og:description" content="Papers, writings, and research posts from the Flashbots research team.">
<meta property="og:url" content="https://research.flashbots.net/">
<meta property="og:image" content="https://research.flashbots.net/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Flashbots Research: papers and posts">
<meta name="twitter:card" content="summary_large_image">
<script>
// apply a saved theme before first paint; default follows the OS
try { const t = localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme = t; } catch(e) {}
</script>
<style>
/* CMU Serif (SIL OFL), the same files flashbots.net serves */
@font-face{font-family:"CMU Serif";src:url(fonts/cmunrm.ttf) format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"CMU Serif";src:url(fonts/cmunsl.ttf) format("truetype");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"CMU Serif";src:url(fonts/cmunbx.ttf) format("truetype");font-weight:700;font-style:normal;font-display:swap}

:root{
  color-scheme:light;
  --bg:#fff;
  --bg-hover:#f7f6f3;
  --ink:#37352f;
  --muted:rgba(55,53,47,.65);
  --dim:rgba(55,53,47,.45);
  --rule:rgba(55,53,47,.16);
  --rule-soft:rgba(55,53,47,.09);
  --focus:#2eaadc;
  --venue:#4f46c8;       /* violet tag for peer-reviewed venues; dark uses writings.flashbots.net's accent */
  --venue-bg:#ecebfb;
  --serif:"CMU Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#18191a;--bg-hover:#242526;--ink:#f5f6f7;  /* writings.flashbots.net dark palette */
    --muted:#bec3c9;--dim:#8d949e;
    --rule:#444950;--rule-soft:#242526;
    --venue:#808aff;--venue-bg:rgba(128,138,255,.12);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#18191a;--bg-hover:#242526;--ink:#f5f6f7;  /* writings.flashbots.net dark palette */
  --muted:#bec3c9;--dim:#8d949e;
  --rule:#444950;--rule-soft:#242526;
  --venue:#808aff;--venue-bg:rgba(128,138,255,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration-color:var(--rule);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}

/* ---------- top bar, as on flashbots.net ---------- */
.topbar{border-bottom:1px solid var(--rule-soft)}
.topbar .wrap{display:flex;align-items:center;gap:20px;height:52px;font-size:15px}
.brand{font-size:16px;text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand svg{fill:currentColor}  /* the bolt, as in the writings.flashbots.net navbar */
#theme{
  background:none;border:1px solid var(--rule);border-radius:4px;color:var(--muted);
  font:inherit;font-size:13px;padding:2px 8px;cursor:pointer
}
#theme:hover{color:var(--ink);border-color:var(--muted)}

/* ---------- masthead ---------- */
.masthead{padding:48px 0 8px}
.masthead h1{font-weight:700;font-size:clamp(32px,6vw,42px);line-height:1.15;margin:0 0 14px}
.lede{color:var(--muted);margin:0;max-width:600px}
.datalinks{font-size:14px;color:var(--dim);margin:14px 0 0}
.datalinks a{color:var(--muted)}

/* ---------- controls ---------- */
.controls{
  position:sticky;top:0;z-index:10;background:var(--bg);
  border-bottom:1px solid var(--rule-soft);padding:16px 0 12px;margin-top:24px
}
.searchrow{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
#search{
  flex:1 1 240px;min-width:0;background:transparent;color:var(--ink);
  border:0;border-bottom:1px solid var(--rule);border-radius:0;
  padding:6px 0;font:inherit;font-size:16px
}
#search::placeholder{color:var(--dim);font-style:italic}
#search:focus{outline:none;border-bottom-color:var(--ink)}
#search::-webkit-search-cancel-button{-webkit-appearance:none}  /* replaced by #clear */
.field{position:relative;flex:1 1 240px;min-width:0;display:flex}
.field #search{padding-right:28px}
#clear{
  position:absolute;right:0;bottom:4px;width:24px;height:24px;
  background:none;border:0;border-radius:4px;color:var(--dim);
  font:inherit;font-size:20px;line-height:1;cursor:pointer
}
#clear:hover{color:var(--ink);background:var(--bg-hover)}
#clear[hidden]{display:none}
.count{font-size:14px;color:var(--dim);white-space:nowrap}
.kinds{display:flex;gap:4px;margin-top:10px;font-size:15px}
.kind{
  background:none;border:0;border-radius:4px;color:var(--muted);
  font:inherit;padding:2px 8px;cursor:pointer
}
.kind:first-child{margin-left:-8px}
.kind:hover{color:var(--ink);background:var(--bg-hover)}
.kind[aria-pressed="true"]{color:var(--ink);font-weight:700}
.kind i{font-style:normal;font-weight:400;color:var(--dim);margin-left:4px;font-size:13px}
#kinds{display:flex;gap:4px}
.key{margin-left:auto;align-self:center;font-size:13px;color:var(--dim)}

/* ---------- timeline ---------- */
.yearmark{
  display:flex;align-items:baseline;gap:14px;
  padding:32px 0 4px;font-weight:700;font-size:22px
}
.yearmark hr{flex:1;border:0;border-top:1px solid var(--rule-soft);margin:0}

.entry{
  display:grid;grid-template-columns:72px 1fr;gap:0 20px;
  padding:14px 0;border-bottom:1px solid var(--rule-soft)
}
.entry:last-child{border-bottom:0}
.when{font-size:14px;color:var(--muted);padding-top:3px;white-space:nowrap}
.when small{
  display:block;margin-top:2px;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)
}
.body h2{font-weight:700;font-size:18px;line-height:1.3;margin:0 0 4px}
.body h2 a{text-decoration:none}
.body h2 a:hover{text-decoration:underline;text-decoration-color:var(--rule)}
.authors{font-size:15px;color:var(--muted);margin:0 0 4px}
/* author names filter the list to that author */
.author{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.author:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
/* Flashbots affiliation: flashbots.net's bolt after the name, like a paper's affiliation mark.
   A mask, so it takes the text color in both themes. */
.fb{color:var(--ink)}
.fb::after,.key::before{
  content:"";display:inline-block;width:.6em;height:.7em;margin-left:2px;vertical-align:.3em;
  background:currentColor;-webkit-mask:url(bolt.svg) center/contain no-repeat;mask:url(bolt.svg) center/contain no-repeat
}
.key::before{vertical-align:-.05em;margin:0 4px 0 0;width:.75em;height:.875em}
.meta{font-size:14px;color:var(--dim);margin:0}
.meta .venue{
  font-style:italic;color:var(--venue);background:var(--venue-bg);
  border-radius:3px;padding:1px 6px
}
.meta a{color:var(--muted)}
.meta a:hover{color:var(--ink)}
.meta .sep{margin:0 6px}

.empty,.error{
  font-size:15px;color:var(--muted);background:var(--bg-hover);
  border-radius:4px;padding:16px 20px;margin:32px 0;line-height:1.6
}

footer{border-top:1px solid var(--rule-soft);margin-top:48px;padding:20px 0 56px}
footer p{font-size:14px;color:var(--dim);margin:0}

@media (max-width:620px){
  .wrap{padding:0 16px}
  .masthead{padding:32px 0 4px}
  .entry{grid-template-columns:1fr;gap:0}
  .when{padding:0 0 4px}
  .when small{display:inline;margin-left:8px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="https://www.flashbots.net/"><svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M7.07289 0L7.91879 0.483459L6.631 4.76674H11.5178L4.19989 12.679L3.35398 12.1956L4.72089 7.64736H0L7.07289 0ZM5.20514 6.03608L6.33835 2.26697L2.28701 6.64736H5.02136L5.20514 6.03608ZM4.93407 10.4124L9.23077 5.76674H6.33078L6.16271 6.3243L4.93407 10.4124Z"/></svg>Flashbots</a>
    <button id="theme" type="button" aria-label="Toggle dark mode">dark</button>
  </div>
</header>

<section class="masthead">
  <div class="wrap">
    <h1>Flashbots Research</h1>
    <p class="lede">Papers and posts by the Flashbots research team, exploring MEV market dynamics and blockchain design challenges at the intersection of economics, security, and cryptography.</p>
    <p class="datalinks">Data: <a href="publications.json">JSON</a> · <a href="publications.csv">CSV</a></p>
  </div>
</section>

<div class="controls">
  <div class="wrap">
    <div class="searchrow">
      <div class="field">
        <input id="search" type="search" placeholder="Search titles, authors, venues…" autocomplete="off" aria-label="Search publications">
        <button id="clear" type="button" aria-label="Clear search" title="Clear search" hidden>×</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="kinds"><span id="kinds" role="group" aria-label="Filter by kind"></span><span class="key">Flashbots author</span></div>
  </div>
</div>

<main class="wrap" id="list" aria-live="polite"></main>

<footer>
  <div class="wrap"><p id="footnote"></p></div>
</footer>

<script>
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const kindsEl = document.getElementById("kinds");
const searchEl = document.getElementById("search");
const themeEl = document.getElementById("theme");

let PUBS = [];
let active = null;   // active kind filter, null = all
const reviewed = p => p.venue && p.venue !== "preprint";

// Category is Paper or Post; where a work appeared is shown by its source links.
const kind = p => p.category;
const KINDS = [["Papers","Paper"], ["Posts","Post"]];

// Link labels by host; anything else shows its hostname.
const SOURCES = {
  "arxiv.org":"arXiv", "eprint.iacr.org":"IACR ePrint", "ia.cr":"IACR ePrint",
  "drops.dagstuhl.de":"LIPIcs", "dl.acm.org":"ACM", "link.springer.com":"Springer",
  "onlinelibrary.wiley.com":"Wiley", "fc25.ifca.ai":"FC",
  "writings.flashbots.net":"Flashbots Writings", "collective.flashbots.net":"Flashbots Forum",
  "ethresear.ch":"ethresear.ch", "x.com":"X", "link.excalidraw.com":"Excalidraw",
  "systex-workshop.github.io":"SysTEX",
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const host = url => new URL(url).hostname.replace(/^www\./,"");
const source = url => SOURCES[host(url)] || host(url);

function stamp(iso){
  const [, m, d] = iso.split("-");
  return `${MONTHS[+m-1]} ${+d}`;
}

// Flashbots authors are the ones tagged "(Flashbots)".
function renderAuthors(raw){
  if(!raw) return '<span style="color:var(--dim)">Authors not listed</span>';
  return raw.split(/,\s*/).map(name => {
    const isFb = name.includes("(Flashbots)");
    const clean = esc(name.replace(/\s*\(Flashbots\)/,"").trim());
    return `<button type="button" class="author${isFb ? " fb" : ""}" title="Show work by ${clean}">${clean}</button>`;
  }).join(", ");
}

function renderMeta(p){
  const parts = [];
  if(reviewed(p)) parts.push(`<span class="venue">${esc(p.venue)}</span>`);
  for(const u of [p.url, p.also].filter(Boolean))
    parts.push(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(source(u))} ↗</a>`);
  return parts.join('<span class="sep">·</span>');
}

function matches(p, q){
  if(active && kind(p) !== active) return false;
  if(!q) return true;
  return [p.title, p.authors, p.venue, source(p.url), p.also && source(p.also)]
    .join(" ").toLowerCase().includes(q);
}

// Search and kind live in the URL (?q=…&kind=papers), so a filtered view can be shared.
function readURL(){
  const params = new URLSearchParams(location.search);
  searchEl.value = params.get("q") || "";
  const k = KINDS.find(([label]) => label.toLowerCase() === params.get("kind"));
  active = k ? k[1] : null;
}
function writeURL(){
  const params = new URLSearchParams();
  const q = searchEl.value.trim();
  if(q) params.set("q", q);
  if(active) params.set("kind", KINDS.find(([, k]) => k === active)[0].toLowerCase());
  const qs = params.toString();
  history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
}

function render(){
  writeURL();
  document.getElementById("clear").hidden = !searchEl.value;
  const q = searchEl.value.trim().toLowerCase();
  const rows = PUBS.filter(p => matches(p, q));

  countEl.textContent = `${rows.length} of ${PUBS.length}`;

  if(!rows.length){
    listEl.innerHTML = `<p class="empty">Nothing matches that search. Try an author's surname, or show all kinds.</p>`;
    return;
  }

  let html = "", year = null;
  for(const p of rows){
    const y = p.date.slice(0,4);
    if(y !== year){
      year = y;
      html += `<div class="yearmark"><span>${y}</span><hr></div>`;
    }
    html += `<article class="entry">
      <div class="when">${stamp(p.date)}<small>${kind(p)}</small></div>
      <div class="body">
        <h2><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2>
        <p class="authors">${renderAuthors(p.authors)}</p>
        <p class="meta">${renderMeta(p)}</p>
      </div>
    </article>`;
  }
  listEl.innerHTML = html;
}

function buildKinds(){
  const mk = (label, value, n) => {
    const b = document.createElement("button");
    b.className = "kind";
    b.type = "button";
    b.innerHTML = `${esc(label)}<i>${n}</i>`;
    b.setAttribute("aria-pressed", String(active === value));
    b.onclick = () => { active = (active === value) ? null : value; buildKinds(); render(); };
    return b;
  };

  kindsEl.innerHTML = "";
  kindsEl.appendChild(mk("All", null, PUBS.length));
  KINDS.forEach(([label, k]) => kindsEl.appendChild(mk(label, k, PUBS.filter(p => kind(p) === k).length)));
}

function syncTheme(){
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  themeEl.textContent = dark ? "light" : "dark";
  themeEl.setAttribute("aria-pressed", String(dark));
  return dark;
}
themeEl.onclick = () => {
  const t = syncTheme() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch(e) {}
  syncTheme();
};
syncTheme();

fetch("publications.json")
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    PUBS = data.sort((a,b) => b.date.localeCompare(a.date));
    readURL();
    buildKinds();
    render();
    const latest = PUBS[0].date.slice(0,4), oldest = PUBS[PUBS.length-1].date.slice(0,4);
    document.getElementById("footnote").innerHTML =
      `${PUBS.length} publications, ${oldest}–${latest}. Source: <a href="https://github.com/flashbots/mev-research/blob/main/publications.yaml">publications.yaml</a> in flashbots/mev-research.`;
    searchEl.addEventListener("input", render);
    document.getElementById("clear").onclick = () => { searchEl.value = ""; render(); searchEl.focus(); };
    listEl.addEventListener("click", e => {
      const a = e.target.closest(".author");
      if(!a) return;
      searchEl.value = a.textContent;
      render();
      window.scrollTo({top: listEl.offsetTop - document.querySelector(".controls").offsetHeight});
    });
  })
  .catch(err => {
    listEl.innerHTML = `<p class="error">
      Couldn't load <code>publications.json</code> (${esc(err.message)}).<br><br>
      If you're opening this file directly from your computer, browsers block that.
      Run <code>python3 tools/build_publications.py</code>, then <code>python3 -m http.server -d docs</code>,
      and visit <code>localhost:8000</code> instead.
    </p>`;
  });
</script>
</body>
</html>
